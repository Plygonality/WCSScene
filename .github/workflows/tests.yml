name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[roman,dev]"
      - name: Lint
        run: ruff check src tests blender_addon scripts
      - name: Unit tests
        run: pytest -q -m "not blender"

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries used by the official Blender build
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6
      - name: Install the scientific package
        run: python -m pip install -e ".[dev]"
      - name: Blender 4.5.14 LTS
        run: |
          curl -L --fail -o /tmp/blender.tar.xz \
            https://ftp.nluug.nl/pub/graphics/blender/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          mkdir -p "$HOME/blender"
          tar -xJf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"
          blender --version
      - name: Blender smoke test
        run: pytest -q tests/test_blender_integration.py
